<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моё портфолио</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/cursor_style.css" />
</head>
<body>
    <script src="scripts/cursor.js"></script>
    <div class="custom-cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
    </div>
    <div class="container">
        <!-- Шапка -->
        <header>
            <h1>Приветствую, я <span>Михаил</span></h1>
            <p class="subtitle">Backend-разработчик</p>
        </header>

        <!-- О себе -->
        <section class="about">
            <img src="https://i.imgur.com/Np5u7EU.jpg" alt="Фото профиля" class="avatar" />
            <div class="about-text">
                <h2>Обо мне</h2>
                <p>
                    Меня зовут Михаил, и немного букав про меня...
                </p>
                <div class="social">
                    <a href="https://github.com/Mihter">GitHub</a>
                    <a href="#">Telegram</a>
                </div>
            </div>
        </section>

        <!-- Стеки -->
        <section class="stacks">
            <h2>Мои стеки</h2>
            <div class="stacks-grid">
                <a href="pages/stack.html?stack=frontend" class="stack-link">
                    <div class="stack-card" data-stack="frontend">
                        <div class="stack-header">
                            <h3>Frontend</h3>
                        </div>
                        <div class="stack-image">
                            <img src="images/react.png" />
                        </div>
                    </div>
                </a>
                <a href="pages/stack.html?stack=backend" class="stack-link">
                    <div class="stack-card" data-stack="backend">
                        <div class="stack-header">
                            <h3>Backend</h3>
                        </div>
                        <div class="stack-image">
                            <img src="images/Microsoft_.NET_logo.png" />
                        </div>
                    </div>
                </a>
                <a href="pages/stack.html?stack=devops" class="stack-link">
                    <div class="stack-card" data-stack="devops">
                        <div class="stack-header">
                            <h3>DevOps</h3>
                        </div>
                        <div class="stack-image">
                            <img src="images/docker.png" />
                        </div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Проекты -->
        <section class="projects">
            <h2>Проекты</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <h3>Название 1</h3>
                    <p>Кратко опишу</p>
                    <a href="#">Смотреть →</a>
                </div>
            </div>
    </div>
    </section>

    <!-- Контакты -->
    <footer>
        <p>📧 mihail.kazmin.04@mail.ru</p>
        <p class="copy">© 2026 Все права защищены</p>
    </footer>
    </div>
</body>
</html>
